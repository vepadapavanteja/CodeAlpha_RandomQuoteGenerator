<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Catalog — Random Quote Generator</title>
<meta name="description" content="A minimal random quote generator built for the CodeAlpha App Development internship.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="catalog-row">
    <span class="catalog-label">Quote Catalog</span>
    <span class="catalog-label">No. <b id="index">01</b> / <span id="total">40</span></span>
  </div>

  <div class="card">
    <p class="mark" aria-hidden="true">&ldquo;</p>
    <p class="quote-text" id="quoteText">Loading...</p>
    <div class="author-row" id="authorRow">
      <span class="rule"></span>
      <span class="author" id="quoteAuthor"></span>
    </div>
  </div>

  <div class="controls">
    <span class="hint">Press space for a new quote</span>
    <div class="icon-row">
      <button class="icon-btn" id="copyBtn" title="Copy quote">Copy</button>
      <button class="new-quote" id="newQuoteBtn">New Quote</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
