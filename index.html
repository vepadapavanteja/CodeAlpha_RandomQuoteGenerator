<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #20211C;
    --ink-soft: #4A4A42;
    --parchment: #EAE3D3;
    --card: #F6F2E7;
    --pine: #3F5C4C;
    --pine-deep: #2E4438;
    --hairline: #C9BFA0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(63,92,76,0.06), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(63,92,76,0.05), transparent 40%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 32px 20px;
  }

  .stage {
    width: 100%;
    max-width: 620px;
  }

  .catalog-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .catalog-label {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .catalog-label b {
    color: var(--pine-deep);
    font-weight: 600;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--pine);
    padding: 56px 48px 44px;
    position: relative;
    box-shadow: 0 1px 0 rgba(32,33,28,0.03);
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-size: 72px;
    line-height: 1;
    color: var(--pine);
    opacity: 0.35;
    margin: 0 0 8px;
    font-weight: 500;
    font-optical-sizing: auto;
  }

  .quote-text {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.42;
    color: var(--ink);
    margin: 0 0 32px;
    min-height: 3.4em;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .quote-text.fading {
    opacity: 0;
    transform: translateY(6px);
  }

  .author-row {
    display: flex;
    align-items: center;
    gap: 14px;
    transition: opacity 0.25s ease;
  }

  .author-row.fading { opacity: 0; }

  .rule {
    flex: 0 0 32px;
    height: 1px;
    background: var(--ink);
    opacity: 0.4;
  }

  .author {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    padding: 0 4px;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  button.new-quote {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--card);
    background: var(--pine);
    border: none;
    padding: 12px 24px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button.new-quote:hover { background: var(--pine-deep); }
  button.new-quote:active { transform: scale(0.98); }

  button.new-quote:focus-visible,
  button.icon-btn:focus-visible {
    outline: 2px solid var(--pine-deep);
    outline-offset: 2px;
  }

  .icon-row {
    display: flex;
    gap: 8px;
  }

  button.icon-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--hairline);
    padding: 11px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  button.icon-btn:hover {
    border-color: var(--pine);
    color: var(--pine-deep);
  }

  @media (prefers-reduced-motion: reduce) {
    .quote-text, .author-row { transition: none; }
  }

  @media (max-width: 480px) {
    .card { padding: 40px 26px 32px; }
    .controls { flex-direction: column; gap: 16px; align-items: stretch; }
    .controls button.new-quote { order: 1; }
    .icon-row { justify-content: center; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="catalog-row">
    <span class="catalog-label">Quote Catalog</span>
    <span class="catalog-label">No. <b id="index">01</b> / <span id="total">40</span></span>
  </div>

  <div class="card">
    <p class="mark" aria-hidden="true">&ldquo;</p>
    <p class="quote-text" id="quoteText">Loading...</p>
    <div class="author-row" id="authorRow">
      <span class="rule"></span>
      <span class="author" id="quoteAuthor"></span>
    </div>
  </div>

  <div class="controls">
    <span class="hint">Press space for a new quote</span>
    <div class="icon-row">
      <button class="icon-btn" id="copyBtn" title="Copy quote">Copy</button>
      <button class="new-quote" id="newQuoteBtn">New Quote</button>
    </div>
  </div>
</div>

<script>
  const quotes = [
    { text: "The unexamined life is not worth living.", author: "Socrates" },
    { text: "It is not that we have a short time to live, but that we waste a lot of it.", author: "Seneca" },
    { text: "The obstacle is the way.", author: "Marcus Aurelius" },
    { text: "What we think, we become.", author: "Buddha" },
    { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
    { text: "The only true wisdom is in knowing you know nothing.", author: "Socrates" },
    { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "He who has a why to live can bear almost any how.", author: "Friedrich Nietzsche" },
    { text: "You have power over your mind, not outside events.", author: "Marcus Aurelius" },
    { text: "Whatever you are, be a good one.", author: "Abraham Lincoln" },
    { text: "The mind is everything. What you think you become.", author: "Buddha" },
    { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey" },
    { text: "Well done is better than well said.", author: "Benjamin Franklin" },
    { text: "The journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "Do not go where the path may lead; go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" },
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Everything you can imagine is real.", author: "Pablo Picasso" },
    { text: "Nothing is impossible; the word itself says I'm possible.", author: "Audrey Hepburn" },
    { text: "In three words I can sum up everything I've learned about life: it goes on.", author: "Robert Frost" },
    { text: "To be yourself in a world that is constantly trying to make you something else is the greatest accomplishment.", author: "Ralph Waldo Emerson" },
    { text: "The best way out is always through.", author: "Robert Frost" },
    { text: "A room without books is like a body without a soul.", author: "Marcus Tullius Cicero" },
    { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
    { text: "You must be the change you wish to see in the world.", author: "Mahatma Gandhi" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "The two most important days in your life are the day you are born and the day you find out why.", author: "Mark Twain" },
    { text: "Happiness is not something ready made. It comes from your own actions.", author: "Dalai Lama" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "Out of difficulties grow miracles.", author: "Jean de La Bruyère" },
    { text: "Curiosity is the engine of achievement.", author: "Ken Robinson" },
    { text: "Change your thoughts and you change your world.", author: "Norman Vincent Peale" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "Wherever you go, go with all your heart.", author: "Confucius" },
    { text: "Try not to become a person of success, but rather try to become a person of value.", author: "Albert Einstein" },
    { text: "Freedom is what you do with what's been done to you.", author: "Jean-Paul Sartre" }
  ];

  const quoteText = document.getElementById('quoteText');
  const quoteAuthor = document.getElementById('quoteAuthor');
  const authorRow = document.getElementById('authorRow');
  const indexLabel = document.getElementById('index');
  const totalLabel = document.getElementById('total');
  const newQuoteBtn = document.getElementById('newQuoteBtn');
  const copyBtn = document.getElementById('copyBtn');

  totalLabel.textContent = quotes.length;
  let lastIndex = -1;

  function pad(n) { return n.toString().padStart(2, '0'); }

  function showQuote() {
    let i;
    do { i = Math.floor(Math.random() * quotes.length); } while (i === lastIndex && quotes.length > 1);
    lastIndex = i;

    quoteText.classList.add('fading');
    authorRow.classList.add('fading');

    setTimeout(() => {
      quoteText.textContent = quotes[i].text;
      quoteAuthor.textContent = quotes[i].author;
      indexLabel.textContent = pad(i + 1);
      quoteText.classList.remove('fading');
      authorRow.classList.remove('fading');
    }, 220);
  }

  newQuoteBtn.addEventListener('click', showQuote);

  copyBtn.addEventListener('click', () => {
    const full = `"${quoteText.textContent}" — ${quoteAuthor.textContent}`;
    navigator.clipboard.writeText(full).then(() => {
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = original; }, 1200);
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      showQuote();
    }
  });

  // initial quote (no fade on load)
  const first = Math.floor(Math.random() * quotes.length);
  lastIndex = first;
  quoteText.textContent = quotes[first].text;
  quoteAuthor.textContent = quotes[first].author;
  indexLabel.textContent = pad(first + 1);
</script>

</body>
</html>
